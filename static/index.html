<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperstead</title>
<style>
:root{
  --bg:#0b0b0c; --panel:#111113; --panel2:#17171a; --line:#27272b; --text:#e8e8ea; --mute:#8b8b93;
  --accent:#f97316; --accent2:#7c3aed; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#eab308; --orange:#f59e0b;
  --chip:var(--chip); --dotgrid:var(--dotgrid); --edge:var(--edge); --hover:var(--hover); --toastbg:var(--toastbg); --ground:#0f1a26;
}
/* Helles Design (Schalter in der Kopfleiste, Standard folgt dem Geraet) */
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7; --text:#1b1f27; --mute:#667085;
  --chip:#e8ebf0; --dotgrid:#d5dae2; --edge:#9aa3b2; --hover:#b8c0cc; --toastbg:#fdecec;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7; --text:#1b1f27; --mute:#667085;
    --chip:#e8ebf0; --dotgrid:#d5dae2; --edge:#9aa3b2; --hover:#b8c0cc; --toastbg:#fdecec;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr 0;height:100%}
#app.panel-open{grid-template-columns:230px 1fr 400px}
/* Sidebar */
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.side-sec{padding:6px 10px}
.side-h{font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:10px 6px 4px;display:flex;justify-content:space-between;align-items:center}
.side-btn{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--text)}
.side-btn:hover{background:var(--panel2)}
.side-btn.active{background:var(--chip)}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
.icon-btn{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:0 4px}
.icon-btn:hover{color:var(--text)}
#projlist{overflow:auto;flex:1}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
/* Hauptbereich */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#pname{flex:0 0 200px;font-weight:600;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#pgoal{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#btnDelProj{flex:none}
#pname:focus,#pgoal:focus{outline:1px solid var(--accent)}
#palette{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:grab;user-select:none}
.pal:hover{border-color:var(--accent)}
.hint{color:var(--mute);font-size:12px;margin-left:6px}
#vp{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dotgrid) 1px,transparent 1px);background-size:24px 24px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.e{stroke:var(--edge);stroke-width:1.6;fill:none}
#edges path.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
#edges path.hit:hover + path.e{stroke:var(--red)}
#edges path.tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none}
.node{position:absolute;width:200px;height:86px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;cursor:move;user-select:none}
.node:hover{border-color:var(--hover)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.n-head{display:flex;gap:10px;align-items:flex-start}
.n-ico{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-weight:700;flex:none}
.n-txt{min-width:0;flex:1}
.n-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-role,.n-prov{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;margin-top:4px}
.dot.run{background:var(--blue);animation:pulse 1s infinite}
.dot.paused{background:#666}
.dot.over{background:var(--red)}
.dot.wait{background:var(--orange)}
@keyframes pulse{50%{opacity:.35}}
.n-foot{position:absolute;left:12px;right:12px;bottom:8px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mute)}
.n-bar{flex:1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.n-bar i{display:block;height:100%;background:var(--accent)}
.port{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  background:var(--chip);border:2px solid var(--edge)}
.port.top{top:-8px}
.port.bot{bottom:-8px;cursor:crosshair}
.port.bot:hover{border-color:var(--accent);background:var(--accent)}
.zoom{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:34px;height:30px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.zoom button:hover{border-color:var(--accent)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;text-align:center}
/* Wachstumsleiste (Hyperstead) */
#growth{display:none;gap:12px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%)}
#growth.on{display:flex}
.g-stage{display:flex;align-items:center;gap:8px;min-width:0}
.g-ico{font-size:22px;line-height:1}
.g-name{font-weight:700;white-space:nowrap}
.g-sub{font-size:11px;color:var(--mute);white-space:nowrap}
.g-bar{flex:1 1 140px;min-width:80px;max-width:320px;height:8px;background:var(--chip);border-radius:5px;overflow:hidden}
.g-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.g-stats{display:flex;gap:10px;font-size:12px;color:var(--mute);white-space:nowrap}
.g-stats b{color:var(--text)}
.g-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.g-tools select{width:auto;padding:4px 8px}
.n-rank{font-size:12px;cursor:help}
/* Panel */
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:hidden;display:none;flex-direction:column;min-height:0}
#app.panel-open #panel{display:flex}
.p-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.p-head b{flex:1}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--text);border-color:var(--accent)}
.p-body{overflow:auto;padding:14px;flex:1}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
textarea{resize:vertical;min-height:110px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;color:var(--text);font-size:13px}
.chk small{display:block;color:var(--mute)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--hover)}
#chatlog{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 330px);overflow:auto;margin-bottom:10px}
.bub{padding:8px 11px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;font-size:13px}
.bub.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.bub.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub.wait{opacity:.6;font-style:italic}
#chatbox{position:relative}
#chatbox.drop::after{content:'Dateien hier ablegen → input/';position:absolute;inset:0;display:grid;place-items:center;
  border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text);font-weight:600;pointer-events:none}
#chatatt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#chatatt:empty{display:none}
#chatpick{border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px;max-height:220px;overflow:auto;padding:4px}
#chatpick:empty{display:none}
#chatpick button{display:flex;width:100%;gap:8px;background:none;border:0;padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;color:var(--text)}
#chatpick button:hover{background:var(--panel)}
#chatpick button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chatpick small{color:var(--mute)}
.att{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 9px;font-size:12px;max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.att.up{opacity:.6}
.att.err{border-color:var(--red)}
#btnMenu{display:none;flex:none;font-size:20px}
#sideBack{display:none}
a.btn{text-decoration:none;color:var(--text);display:inline-block}
a.btn.pri{color:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bud{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:6px}
.bud i{display:block;height:100%;background:var(--accent)}
.task{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel2)}
.task summary{padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.task summary span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .tb{padding:0 10px 10px}
.res{position:relative}
.res .cpy{position:absolute;top:4px;right:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer;opacity:.85;z-index:1}
.res .cpy:hover{opacity:1;border-color:var(--accent)}
.task pre,.res pre{user-select:text;-webkit-user-select:text}
.res pre{padding-top:30px}
.task pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;max-height:300px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
.chip{font-size:11px;border-radius:10px;padding:1px 8px;background:var(--chip);color:var(--mute);white-space:nowrap}
.chip.running{background:rgba(59,130,246,.2);color:#7db0ff}
.chip.done{background:rgba(34,197,94,.18);color:#6fdc98}
.chip.failed,.chip.blocked{background:rgba(239,68,68,.2);color:#ff8a8a}
.chip.waiting_approval{background:rgba(245,158,11,.2);color:#ffc062}
.chip.waiting_subtasks{background:rgba(168,85,247,.2);color:#d3a6ff}
.tree{margin:8px 0 0 4px;border-left:2px solid var(--line);padding-left:10px}
.tree details{margin:5px 0}
.tree summary{cursor:pointer;display:flex;gap:6px;align-items:center;font-size:12px}
.tree summary .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .who{color:var(--mute)}
.tree pre{font-size:11px;max-height:200px}
.tlabel{font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:10px}
.chip.queued{background:rgba(234,179,8,.18);color:#f0cd5a}
.logrow{font-size:12px;border-bottom:1px solid var(--line);padding:6px 0}
.logrow .ts{color:var(--mute)}
/* Overlay */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
#ov.on{display:grid}
#ovbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(720px,94vw);max-height:84vh;display:flex;flex-direction:column}
#ovbox header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#ovbox header b{flex:1}
#ovbody{padding:14px 16px;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toastbg);border:1px solid var(--red);
  padding:8px 14px;border-radius:10px;display:none;z-index:99;max-width:80vw}
@media (max-width:1100px) and (min-width:821px){
  #app{grid-template-columns:200px 1fr 0}
  #app.panel-open{grid-template-columns:200px 1fr 340px}
  #pname{flex-basis:150px}
}
@media (max-width:820px){
  #growth{flex-wrap:wrap;padding:6px 10px;gap:8px}
  .g-bar{flex:1 1 100%;max-width:none;order:3}
  .g-stats{display:none}
  #app,#app.panel-open{grid-template-columns:1fr;height:100dvh}
  #main{grid-column:1;grid-row:1}
  #side{display:none}
  #app.side-open #side{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);z-index:40;box-shadow:4px 0 24px rgba(0,0,0,.5)}
  #app.side-open #sideBack{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
  #btnMenu{display:block}
  #app.panel-open #panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);z-index:20}
  #topbar{flex-wrap:wrap;padding:8px 10px;gap:8px}
  #pname{flex:1 1 120px;min-width:0}
  #pgoal{flex:1 1 100%;order:3}
  #palette{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;-webkit-overflow-scrolling:touch}
  #palette>span:first-child,.hint{display:none}
  .pal{white-space:nowrap;flex:none}
  .side-btn{padding:11px 10px}
  .btn{padding:9px 13px}
  .icon-btn{padding:4px 8px;font-size:18px}
  .tab{padding:11px 4px;font-size:13px}
  input[type=text],input[type=number],select,textarea{font-size:16px} /* verhindert Auto-Zoom auf iOS */
  #ovbox{width:100vw;max-height:100%;height:100%;border-radius:0}
  #ov.on{place-items:stretch}
  #chatlog{max-height:calc(100dvh - 300px)}
  .att span{max-width:150px}
  #toast{max-width:94vw;bottom:14px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo">H</div><b>Hyperstead</b></div>
    <div class="side-sec">
      <button class="side-btn" id="btnInbox">📬 Post <span class="badge" id="inbadge" style="display:none">0</span></button>
      <button class="side-btn" id="btnApprovals">✋ Freigaben <span class="badge" id="apbadge" style="display:none">0</span></button>
      <button class="side-btn" id="btnGroupAI" title="Mehrere Agenten auswählen und gemeinsam auf eine KI / ein Modell umstellen">🔀 KI für Gruppe</button>
      <button class="side-btn" id="btnModels" title="Agenten, deren KI-Modell nicht mehr existiert, auf ein anderes umstellen">⚠ Modelle <span class="badge" id="mdbadge" style="display:none">0</span></button>
      <button class="side-btn" id="btnSched" title="Öffnungszeiten der Firma und tägliche Aufgaben je Mitarbeiter">🕘 Zeitplan <span class="badge" id="schbadge" style="display:none">zu</span></button>
      <button class="side-btn" id="btnFiles">📁 Dateien dieses Projekts</button>
      <button class="side-btn" id="btnGoals" title="Ziele und Unterziele des Projekts mit Fortschritt">🎯 Ziele</button>
      <button class="side-btn" id="btnUsage" title="Aufrufe, Tokens und geschätzte Kosten je Projekt, Agent und Modell">📊 Nutzung &amp; Kosten</button>
      <button class="side-btn" id="btnConn" title="Webhooks: Agenten rufen deine Dienste auf, Aufträge kommen von außen">🔌 Verbindungen</button>
      <button class="side-btn" id="btnCloud" title="GitHub, Google Drive, OneDrive und Telegram: wohin Dateien hochgeladen werden">☁️ Cloud</button>
      <button class="side-btn" id="btnKnow" title="Was alle Agenten dieses Projekts immer wissen sollen">🧠 Firmenwissen</button>
      <button class="side-btn" id="btnAudit">📜 Verlauf (Audit-Log)</button>
      <button class="side-btn" id="btnLogout" style="display:none" onclick="location.href='/logout'">🚪 Abmelden</button>
    </div>
    <div class="side-h"><span>Projekte</span><span><button class="icon-btn" id="btnTplProj" title="Firma aus Vorlage (Webagentur, Buchhaltung, Handel …)">🏢</button><button class="icon-btn" id="btnNewProj" title="Neues Projekt">＋</button></span></div>
    <div id="projlist" class="side-sec"></div>
  </aside>

  <div id="sideBack"></div>
  <section id="main">
    <div id="topbar">
      <button class="icon-btn" id="btnMenu" title="Menü">☰</button>
      <input id="pname" type="text" placeholder="Projektname" disabled>
      <input id="pgoal" type="text" placeholder="Ziel des Projekts (alle Agenten kennen es)" disabled>
      <button class="btn danger sm" id="btnDelProj" style="display:none">Projekt löschen</button>
    </div>
    <div id="growth" aria-live="polite">
      <div class="g-stage"><span class="g-ico" id="gIco"></span><div><div class="g-name" id="gName"></div><div class="g-sub" id="gSub"></div></div></div>
      <div class="g-bar" title="Fortschritt bis zur nächsten Stufe"><i id="gBar"></i></div>
      <div class="g-stats" id="gStats"></div>
      <div class="g-tools">
        <select id="gWorld" title="Welt dieses Projekts (ändert nur das Aussehen)"></select>
        <button class="icon-btn" id="gTheme" title="Hell / Dunkel">🌓</button>
        <button class="icon-btn" id="gInfo" title="Wie das Wachstum funktioniert">ⓘ</button>
      </div>
    </div>
    <div id="palette">
      <span style="color:var(--mute)">Agent hinzufügen (ziehen oder klicken):</span>
    </div>
    <div id="vp">
      <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit">Fit</button></div>
      <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
      <div class="empty" id="empty">Wähle links ein Projekt oder lege eins mit ＋ an.</div>
    </div>
  </section>

  <aside id="panel">
    <div class="p-head"><b id="ptitle">Agent</b><button class="icon-btn" id="pclose">✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="set">Einstellungen</button>
      <button class="tab" data-tab="chat">💬 Chat</button>
      <button class="tab" data-tab="tasks">Aufgaben</button>
      <button class="tab" data-tab="log">Verlauf</button>
    </div>
    <div class="p-body" id="pbody"></div>
  </aside>
</div>

<div id="ov"><div id="ovbox"><header><b id="ovtitle"></b><button class="icon-btn" id="ovclose">✕</button></header><div id="ovbody"></div></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W = 200, H = 86;
const COLORS = ['#ec4899','#3b82f6','#22c55e','#a855f7','#f59e0b','#06b6d4'];
const STATUS = {todo:'Offen',queued:'Wartet',running:'Läuft',waiting_subtasks:'Wartet auf Team',waiting_approval:'Freigabe nötig',done:'Fertig',failed:'Fehler',blocked:'Blockiert'};
const fmtTok = n => n>=1000 ? (n/1000).toFixed(1)+'k Tok' : n+' Tok';
const MGR = {delegate:true,judge:true,auto_run:true};

const TPL = {
  ceo:{name:'CEO',role:'Chief Executive Officer',perms:{...MGR,recruit:true},
    prompt:'Du führst das Unternehmen. Zerlege das Projektziel in klare Aufträge, verteile sie an die passenden Mitarbeiter, prüfe deren Berichte kritisch und gib unzureichende Arbeit mit konkretem Feedback zurück. Dein Endergebnis fasst alles verständlich zusammen. Antworte auf Deutsch.'},
  cto:{name:'CTO',role:'Chief Technology Officer',perms:MGR,

async function api(path, method='GET', body){
  const r = await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-PCL':'1'},body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){ location.href='/login'; throw new Error('Sitzung abgelaufen'); }
  if(!r.ok){ const t = await r.text(); toast(t.slice(0,300)||('Fehler '+r.status)); throw new Error(t); }
  return r.json();
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',4500); }

      <div class="port bot" title="Ziehen, um einen Mitarbeiter zu verbinden"></div>`;

function drawEdges(){
  const svg = $('#edges'); let h='';
  S.graph.agents.forEach(a=>{
    if(!a.parent_id) return; const p = agentById(a.parent_id); if(!p) return;
    const x1=p.x+W/2,y1=p.y+H,x2=a.x+W/2,y2=a.y,my=(y1+y2)/2;
    const d=`M${x1},${y1} V${my} H${x2} V${y2}`;
    h+=`<path class="hit" data-child="${a.id}" d="${d}"><title>Klicken zum Trennen</title></path><path class="e" d="${d}"/>`;
  });
  svg.innerHTML = h;
}
async function autoLayout(){
  const ag=S.graph.agents, ids=new Set(ag.map(a=>a.id)), kids={};
  ag.forEach(a=>{ if(a.parent_id && ids.has(a.parent_id)) (kids[a.parent_id]=kids[a.parent_id]||[]).push(a); });
  const G=30, ROW=H+34, COLS=5, pos={};
  function width(a){ const k=kids[a.id]||[]; if(!k.length) return W+G;
    if(k.every(c=>!(kids[c.id]||[]).length) && k.length>COLS) return COLS*(W+G);
    return Math.max(W+G, k.reduce((s,c)=>s+width(c),0)); }
  function place(a,x0,y){ const k=kids[a.id]||[], w=width(a);
    pos[a.id]={x:Math.round(x0+w/2-W/2),y};
    if(!k.length) return;
    if(k.every(c=>!(kids[c.id]||[]).length) && k.length>COLS){
      k.forEach((c,i)=>{ const r=Math.floor(i/COLS), col=i%COLS, inRow=Math.min(COLS,k.length-r*COLS);
        pos[c.id]={x:Math.round(x0+w/2-inRow*(W+G)/2+col*(W+G)+G/2), y:y+H+60+r*ROW}; });
    } else { let x=x0; k.forEach(c=>{ place(c,x,y+H+70); x+=width(c); }); }
  }
  let x=0; ag.filter(a=>!a.parent_id||!ids.has(a.parent_id)).forEach(r=>{ place(r,x,40); x+=width(r)+G; });
  await Promise.all(ag.map(a=>api('/agents/'+a.id,'PUT',pos[a.id]||{})));
  await refresh(true); V.x=40; V.y=30; V.s=Math.min(1, ($('#vp').clientWidth-80)/Math.max(x,1)); applyView();
}

/* ---------- Ansicht (Pan/Zoom) ---------- */
function applyView(){
  $('#world').style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  const vp=$('#vp'); vp.style.backgroundSize=`${24*V.s}px ${24*V.s}px`; vp.style.backgroundPosition=`${V.x}px ${V.y}px`;
}
function toWorld(cx,cy){ const r=$('#vp').getBoundingClientRect(); return {x:(cx-r.left-V.x)/V.s, y:(cy-r.top-V.y)/V.s}; }
function zoomAt(f,cx,cy){
  const r=$('#vp').getBoundingClientRect(); const mx=cx-r.left,my=cy-r.top;
  const ns=Math.min(2,Math.max(.3,V.s*f)); V.x=mx-(mx-V.x)*(ns/V.s); V.y=my-(my-V.y)*(ns/V.s); V.s=ns; applyView();
}
function fit(){
  const vp=$('#vp').getBoundingClientRect(); const as=S.graph?S.graph.agents:[];
  if(!as.length){ V.x=80;V.y=40;V.s=1; return applyView(); }
  const x0=Math.min(...as.map(a=>a.x)),y0=Math.min(...as.map(a=>a.y));
  const x1=Math.max(...as.map(a=>a.x+W)),y1=Math.max(...as.map(a=>a.y+H));
  const s=Math.min(1.2,Math.max(.3,Math.min((vp.width-80)/(x1-x0),(vp.height-80)/(y1-y0))));
  V.s=s; V.x=(vp.width-(x1-x0)*s)/2-x0*s; V.y=(vp.height-(y1-y0)*s)/2-y0*s; applyView();
}
$('#zin').onclick=()=>{const r=$('#vp').getBoundingClientRect();zoomAt(1.2,r.left+r.width/2,r.top+r.height/2)};
$('#zout').onclick=()=>{const r=$('#vp').getBoundingClientRect();zoomAt(1/1.2,r.left+r.width/2,r.top+r.height/2)};
$('#zfit').onclick=fit;
$('#vp').addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});

/* ---------- Maus: Pan / Knoten ziehen / verbinden ---------- */
const touches=new Map(); let pinch=null;  // Touch: zwei Finger = zoomen
$('#vp').addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom')) return;
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      if(drag&&drag.type==='link'){ const t=$('#tmp'); if(t) t.remove(); }
      drag=null; const [a,b]=[...touches.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; return;
    }
    if(touches.size>2) return;
  }
  const port = e.target.closest('.port.bot'); const node = e.target.closest('.node');
  if(port && node){
    e.preventDefault();
    const id=+node.dataset.id; const a=agentById(id);
    drag={type:'link',from:id,x1:a.x+W/2,y1:a.y+H};
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('class','tmp'); p.id='tmp'; $('#edges').appendChild(p);
    return;
  }
  if(node){
    e.preventDefault();
    const id=+node.dataset.id; const a=agentById(id); const w=toWorld(e.clientX,e.clientY);
    drag={type:'node',id,el:node,dx:w.x-a.x,dy:w.y-a.y,moved:false};
    selectAgent(id,true); return;
  }
  if(e.target.closest('#edges path.hit')) return;
  drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y}; $('#vp').classList.add('panning');
});
window.addEventListener('pointermove',e=>{
  if(touches.has(e.pointerId)){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&touches.size===2){
      const [a,b]=[...touches.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch.d>0) zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); pinch.d=d; return;
    }
  }
  if(!drag) return;
  if(drag.type==='pan'){ V.x=drag.vx+e.clientX-drag.sx; V.y=drag.vy+e.clientY-drag.sy; applyView(); }
  else if(drag.type==='node'){
    const w=toWorld(e.clientX,e.clientY); const a=agentById(drag.id);
    a.x=Math.round(w.x-drag.dx); a.y=Math.round(w.y-drag.dy); drag.moved=true;
    drag.el.style.left=a.x+'px'; drag.el.style.top=a.y+'px'; drawEdges();
  } else if(drag.type==='link'){
    const w=toWorld(e.clientX,e.clientY); const my=(drag.y1+w.y)/2;
    $('#tmp').setAttribute('d',`M${drag.x1},${drag.y1} V${my} H${w.x} V${w.y}`);
  }
});
const endTouch=e=>{ touches.delete(e.pointerId); if(touches.size<2) pinch=null; };
window.addEventListener('pointercancel',e=>{ endTouch(e); if(drag&&drag.type==='link'){ const t=$('#tmp'); if(t) t.remove(); } drag=null; $('#vp').classList.remove('panning'); });
window.addEventListener('pointerup',async e=>{
  endTouch(e);
  if(!drag) return; const d=drag; drag=null; $('#vp').classList.remove('panning');
  if(d.type==='node' && d.moved){ const a=agentById(d.id); api('/agents/'+d.id,'PUT',{x:a.x,y:a.y}); }
  if(d.type==='link'){
    const t=$('#tmp'); if(t) t.remove();
    const el=document.elementFromPoint(e.clientX,e.clientY); const n=el&&el.closest('.node');
    if(n && +n.dataset.id!==d.from){
      try{ await api('/agents/'+n.dataset.id,'PUT',{parent_id:d.from}); }catch(_){}
      refresh(true);
    }
  }
});

const miniMd = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,;:!?])/g,'$1<i>$2</i>');
async function drawChat(a){
  $('#pbody').innerHTML=`
    <div style="color:var(--mute);font-size:12px;margin-bottom:8px">Freies Gespräch mit ${esc(a.name)} – zum Nachdenken, Philosophieren, Ideen entwickeln. Ohne Werkzeuge; zum Umsetzen gib das Gespräch als Auftrag ans Team. Angehängte Dateien (📎, hineinziehen, einfügen oder 📂 aus <code>input/</code>) bekommt ${esc(a.name)} direkt mit der Nachricht: Texte, PDFs und Word als Text, Bilder als Bild.</div>
    <div id="chatlog"></div>
    <div id="chatbox">
      <div id="chatpick"></div>
      <div id="chatatt"></div>
      <textarea id="chatin" style="min-height:70px" placeholder="Schreib etwas … (Enter sendet, Shift+Enter = neue Zeile)"></textarea>
    </div>
    <input type="file" id="chatfile" multiple style="display:none">
    <div class="row"><button class="btn pri" id="chatsend">Senden</button><button class="btn" id="chatattach" title="Dateien anhängen (z. B. muster.png, PDFs, Layouts). Sie werden nach input/ gespeichert.">📎 Datei</button><button class="btn" id="chatinput" title="Eine Datei anhängen, die schon in input/ liegt">📂 aus input/</button><button class="btn" id="chatorder">📋 Als Auftrag erteilen</button><button class="btn danger sm" id="chatclear">Verlauf leeren</button></div>`;
  const log=$('#chatlog'), att=[];  // att: {file, el, path, busy}
  const add=(role,text,cls='')=>{ const d=document.createElement('div'); d.className='bub '+role+' '+cls; d.innerHTML=role==='assistant'?miniMd(text):esc(text); log.appendChild(d); log.scrollTop=log.scrollHeight; return d; };
  (await api('/agents/'+a.id+'/chat')).forEach(m=>add(m.role,m.content));
  function attach(files){
    if(!S.pid){ toast('Erst ein Projekt wählen.'); return; }
    for(const f of files){
      const it={file:f,path:null,busy:true}; att.push(it);
      it.el=document.createElement('span'); it.el.className='att up'; it.el.innerHTML='<span></span><button class="icon-btn" title="Entfernen">✕</button>';
      it.el.firstChild.textContent='⏳ '+(f.name||'Bild');
      it.el.lastChild.onclick=()=>{ att.splice(att.indexOf(it),1); it.el.remove(); };
      $('#chatatt').appendChild(it.el);
      it.up=uploadFile(f).then(r=>{ it.path=r.path; it.el.className='att'; it.el.firstChild.textContent='📎 '+r.path; it.el.title=r.path; })
        .catch(e=>{ it.el.className='att err'; it.el.firstChild.textContent='⚠ '+(f.name||'Datei'); it.el.title=e.message; toast(e.message); })
        .finally(()=>{ it.busy=false; });
    }
  }
  function attachExisting(path){
    if(att.some(x=>x.path===path)) return;
    const it={path,busy:false,up:Promise.resolve()}; att.push(it);
    it.el=document.createElement('span'); it.el.className='att'; it.el.innerHTML='<span></span><button class="icon-btn" title="Entfernen">✕</button>';
    it.el.firstChild.textContent='📎 '+path; it.el.title=path;
    it.el.lastChild.onclick=()=>{ att.splice(att.indexOf(it),1); it.el.remove(); };
    $('#chatatt').appendChild(it.el);
  }
  $('#chatinput').onclick=async()=>{
    const pick=$('#chatpick'); if(pick.innerHTML){ pick.innerHTML=''; return; }
    if(!S.pid) return;
    const r=await api('/projects/'+S.pid+'/files'); const fs=r.files.filter(f=>f.path.startsWith('input/')).sort((x,y)=>y.mtime-x.mtime);
    if(!fs.length){ toast('In input/ liegt noch nichts. Mit 📎 hochladen.'); return; }
    fs.forEach(f=>{ const b=document.createElement('button'); b.innerHTML='<span></span><small></small>'; b.firstChild.textContent=f.path; b.lastChild.textContent=f.size<1048576?Math.max(1,Math.round(f.size/1024))+' KB':(f.size/1048576).toFixed(1)+' MB';
      b.onclick=()=>{ attachExisting(f.path); b.remove(); if(!pick.querySelector('button')) pick.innerHTML=''; }; pick.appendChild(b); });
  };
  async function send(){
    const inp=$('#chatin'); let msg=inp.value.trim();
    if(att.some(x=>x.busy)){ $('#chatsend').disabled=true; $('#chatsend').textContent='Lädt hoch …'; await Promise.all(att.map(x=>x.up)); $('#chatsend').textContent='Senden'; }
    const files=att.filter(x=>x.path).map(x=>x.path);
    if(!msg && !files.length){ $('#chatsend').disabled=false; return; }
    const shown=(files.length?'📎 '+files.join(', ')+(msg?'\n\n':''):'')+msg;
    inp.value=''; const ub=add('user',shown); const w=add('assistant','denkt nach …','wait'); $('#chatsend').disabled=true;
    try{
      const r=await api('/agents/'+a.id+'/chat','POST',{message:msg,files});
      w.className='bub assistant'; w.innerHTML=miniMd(r.reply);
      if((r.files||[]).length>files.length) ub.textContent='📎 '+r.files.join(', ')+(msg?'\n\n':'')+msg;
      att.splice(0).forEach(x=>x.el.remove()); $('#chatpick').innerHTML='';
    }
    catch(e){ w.remove(); ub.remove(); inp.value=msg; }
    $('#chatsend').disabled=false; log.scrollTop=log.scrollHeight; inp.focus();
  }
  $('#chatsend').onclick=send;
  $('#chatin').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
  $('#chatattach').onclick=()=>$('#chatfile').click();
  $('#chatfile').onchange=e=>{ attach([...e.target.files]); e.target.value=''; };
  const box=$('#pbody'), zone=$('#chatbox'); let dz=0;
  box.ondragenter=e=>{ if([...e.dataTransfer.types].includes('Files')){ e.preventDefault(); dz++; zone.classList.add('drop'); } };
  box.ondragover=e=>{ if([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
  box.ondragleave=()=>{ if(--dz<=0){ dz=0; zone.classList.remove('drop'); } };
  box.ondrop=e=>{ if(!e.dataTransfer.files.length) return; e.preventDefault(); dz=0; zone.classList.remove('drop'); attach([...e.dataTransfer.files]); };
  $('#chatin').onpaste=e=>{ const fs=[...(e.clipboardData&&e.clipboardData.files||[])]; if(fs.length){ e.preventDefault(); attach(fs); } };
  $('#chatorder').onclick=async()=>{
    const t=prompt('Titel des Auftrags (leer = aus deiner letzten Nachricht):',''); if(t===null) return;
    const r=await api('/agents/'+a.id+'/chat/order','POST',{title:t}); toast('Auftrag #'+r.id+' erteilt, das Ergebnis kommt als Post.'); refresh(true);
  };
  $('#chatclear').onclick=async()=>{ if(confirm('Gesprächsverlauf löschen?')){ await api('/agents/'+a.id+'/chat','DELETE'); drawChat(a); } };
}
/* ---------- Ergebnisse kopieren (geht auch ohne HTTPS, dort fehlt navigator.clipboard) ---------- */
const resHtml = t => `<div class="res"><button class="cpy" title="Ganzen Text kopieren">📋 Kopieren</button><pre>${esc(t)}</pre></div>`;
async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(_){}
  const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.res .cpy'); if(!b) return; e.preventDefault(); e.stopPropagation();
  const ok=await copyText(b.nextElementSibling.textContent);
  b.textContent=ok?'✓ Kopiert':'Markieren und kopieren'; setTimeout(()=>b.textContent='📋 Kopieren',1800);
  if(!ok){ const r=document.createRange(); r.selectNodeContents(b.nextElementSibling); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }
});
// Liste nur neu zeichnen, wenn sich etwas geaendert hat und gerade nichts markiert ist (sonst geht die Markierung beim Aktualisieren verloren)
function selectingIn(el){ const sel=getSelection(); return sel && !sel.isCollapsed && sel.rangeCount && el.contains(sel.getRangeAt(0).commonAncestorContainer); }

function treeHtml(list){
  return list.map(c=>`<details ${S.openTasks.has('c'+c.id)?'open':''} data-cid="${c.id}">
    <summary><span class="chip ${c.status}">${STATUS[c.status]||c.status}</span><span class="t">${esc(c.title)}</span><span class="who">${esc(c.agent_name||'?')}${c.rounds?` · ${c.rounds}× überarbeitet`:''}</span></summary>
    ${c.result?resHtml(c.result):''}
    ${(c.children&&c.children.length)?`<div class="tree">${treeHtml(c.children)}</div>`:''}
  </details>`).join('');
}
async function loadTasks(){
  const a=agentById(S.sel); if(!a) return;
  const list=$('#tlist'); if(!list) return;
  const tasks=await api('/agents/'+a.id+'/tasks');
  const html=tasks.length?tasks.map(t=>`
    <details class="task" data-id="${t.id}" ${S.openTasks.has(t.id)?'open':''}>
      <summary><span class="chip ${t.status}">${STATUS[t.status]||t.status}</span><span class="t">${esc(t.title)}</span></summary>
      <div class="tb">
        ${t.description?`<div style="color:var(--mute);font-size:12px;white-space:pre-wrap">${esc(t.description)}</div>`:''}
        ${t.result?resHtml(t.result):''}
        ${(t.children&&t.children.length)?`<div class="tlabel">Team-Arbeit</div><div class="tree">${treeHtml(t.children)}</div>`:''}
        <div class="row" style="margin-top:6px">
          ${['todo','failed','blocked','done'].includes(t.status)?`<button class="btn sm pri" data-run="${t.id}" data-kids="${(t.children&&t.children.length)?1:0}">▶ ${t.status==='done'?'Nochmal':'Starten'}</button>`:''}
          <button class="btn sm danger" data-del="${t.id}">Löschen</button>
        </div>
      </div>
    </details>`).join(''):'<div style="color:var(--mute)">Noch keine Aufgaben.</div>';
  if(html===list._html || selectingIn(list)) return;
  list._html=html;
  // Scrollpositionen der Ergebnisboxen behalten
  const sc=[...list.querySelectorAll('pre')].map(p=>p.scrollTop);
  list.innerHTML=html;
  list.querySelectorAll('pre').forEach((p,i)=>{ if(sc[i]) p.scrollTop=sc[i]; });
  list.querySelectorAll('details.task').forEach(d=>d.addEventListener('toggle',()=>{ d.open?S.openTasks.add(+d.dataset.id):S.openTasks.delete(+d.dataset.id); }));
  list.querySelectorAll('.tree details').forEach(d=>d.addEventListener('toggle',e=>{ e.stopPropagation(); const k='c'+d.dataset.cid; d.open?S.openTasks.add(k):S.openTasks.delete(k); }));
  list.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{ if(b.dataset.kids==='1' && !confirm('Die bisherigen Aufgaben des Teams werden gelöscht und alles startet neu. Fortfahren?')) return; await api('/tasks/'+b.dataset.run+'/run','POST',{}); refresh(true); });
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(confirm('Aufgabe löschen?')){ await api('/tasks/'+b.dataset.del,'DELETE'); refresh(true);} });
}

$('#btnModels').onclick=()=>{

async function showCloud(){
  if(!S.pid){ toast('Erst ein Projekt wählen.'); return; }
  openOv('☁️ Cloud'); const body=$('#ovbody');
  const r=await api('/projects/'+S.pid+'/cloud');
  const help={github:'Token und Repo in .env (GITHUB_UPLOAD_TOKEN, GITHUB_UPLOAD_REPO). Dateien über 50 MB gehen als Release-Anhang.',
    gdrive:'Hyperstead sieht nur Dateien und Ordner, die es selbst angelegt hat. Fehlende Ordner legt es an.',
    onedrive:'Ordner im ganzen OneDrive möglich, fehlende Ordner legt OneDrive an.',
    telegram:'Schickt Dateien bis 50 MB an deinen Chat. Am Handy: /datei'};
  body.innerHTML=`<div style="color:var(--mute);font-size:12px;margin-bottom:10px">Hier richtest du ein, wohin Dateien hochgeladen werden. Hochladen kannst du jede Datei unter 📁 Dateien (Knopf ☁️). Agenten mit dem Recht „Darf in die Cloud hochladen“ fragen dich vorher immer unter ✋ Freigaben. Anleitung: <code>docs/cloud.md</code></div>`
    + Object.entries(r.services).map(([k,s])=>`<div class="task" style="padding:10px;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center"><b style="flex:1">${esc(s.label)}</b><span style="font-size:12px">${!s.configured?'⚪ nicht eingerichtet':s.logged_in?'🟢 bereit':'🟡 nicht angemeldet'}</span></div>
      <div style="color:var(--mute);font-size:12px;margin:3px 0 6px">${esc(s.configured?help[k]:s.hint)}</div>
      ${k in r.folders?`<label>Zielordner für dieses Projekt (leer = oberste Ebene)</label><div class="row"><input type="text" data-cf="${k}" value="${esc(r.folders[k])}" style="flex:1"><button class="btn sm" data-cfsave="${k}">Speichern</button></div>`:''}
      ${s.login&&s.configured?`<div class="row" style="margin-top:6px">${s.logged_in?`<button class="btn sm" data-clogout="${k}">Abmelden</button>`:''}<button class="btn ${s.logged_in?'':'pri'} sm" data-clogin="${k}">${s.logged_in?'Neu anmelden':'Anmelden'}</button></div>
        <div id="cl_${k}" style="font-size:13px;margin-top:6px">${s.pending&&s.pending.state==='pending'?loginHtml(s.pending):''}</div>`:''}
    </div>`).join('');
  function loginHtml(p){ return `Öffne <a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(p.url)}</a> (am Handy oder PC) und gib diesen Code ein:<div style="font-size:24px;font-weight:700;letter-spacing:2px;margin:6px 0">${esc(p.user_code)}</div><button class="btn sm" onclick="copyText('${esc(p.user_code)}')">📋 Code kopieren</button> <span style="color:var(--mute)">Ich warte auf die Bestätigung …</span>`; }
  async function watch(k){
    for(let i=0;i<200;i++){
      await new Promise(res=>setTimeout(res,3000));
      if(!$('#cl_'+k)) return;
      const x=(await api('/projects/'+S.pid+'/cloud')).services[k];
      const p=x.pending||{};
      if(p.state==='ok'){ toast(x.label+': angemeldet'); showCloud(); return; }
      if(p.state==='error'){ $('#cl_'+k).textContent='❌ '+p.message; return; }
    }
  }
  body.querySelectorAll('[data-cfsave]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.cfsave;
    const x=await api('/projects/'+S.pid+'/cloud','PUT',{folders:{[k]:body.querySelector(`[data-cf="${k}"]`).value}});
    body.querySelector(`[data-cf="${k}"]`).value=x.folders[k]; toast('Gespeichert'); });
  body.querySelectorAll('[data-clogin]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.clogin;
    try{ const p=await api('/cloud/'+k+'/login','POST',{}); $('#cl_'+k).innerHTML=loginHtml(p); watch(k); }catch(_){} });
  body.querySelectorAll('[data-clogout]').forEach(b=>b.onclick=async()=>{ if(confirm('Abmelden? Danach kann Hyperstead dort nichts mehr hochladen.')){ await api('/cloud/'+b.dataset.clogout+'/logout','POST',{}); showCloud(); } });
  Object.entries(r.services).forEach(([k,s])=>{ if(s.pending&&s.pending.state==='pending') watch(k); });
}
$('#btnCloud').onclick=showCloud;

async function cloudUpload(path){
  const r=await api('/projects/'+S.pid+'/cloud');
  const ready=Object.entries(r.services).filter(([k,s])=>s.configured&&s.logged_in);
  openOv('☁️ Hochladen'); const body=$('#ovbody');
  if(!ready.length){ body.innerHTML='<div style="color:var(--mute)">Noch kein Dienst eingerichtet. Siehe ☁️ Cloud in der Seitenleiste.</div><div class="row" style="margin-top:8px"><button class="btn sm" id="cu_back">Zurück</button></div>'; $('#cu_back').onclick=showFiles; return; }
  body.innerHTML=`<div style="word-break:break-all;margin-bottom:8px"><b>${esc(path)}</b></div>
    <label>Wohin?</label><select id="cu_to">${ready.map(([k,s])=>`<option value="${k}">${esc(s.label)}</option>`).join('')}</select>
    <div id="cu_fwrap"><label>Ordner (leer = oberste Ebene)</label><input type="text" id="cu_folder"></div>
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="cu_go">Hochladen</button><button class="btn sm" id="cu_back">Zurück</button></div>
    <div id="cu_st" style="margin-top:10px;font-size:13px;word-break:break-all"></div>`;
  const setF=()=>{ const k=$('#cu_to').value; $('#cu_fwrap').style.display=k in r.folders?'':'none'; $('#cu_folder').value=r.folders[k]||''; };
  $('#cu_to').onchange=setF; setF(); $('#cu_back').onclick=showFiles;
  $('#cu_go').onclick=async()=>{ const k=$('#cu_to').value; $('#cu_go').disabled=true; $('#cu_st').textContent='Lade hoch … (große Dateien dauern)';
    try{
      const j=await api('/projects/'+S.pid+'/cloud/upload','POST',k in r.folders?{to:k,path,folder:$('#cu_folder').value}:{to:k,path});
      for(;;){ await new Promise(res=>setTimeout(res,2000)); const x=await api('/cloud/jobs/'+j.job);
        if(x.state==='running') continue;
        const link=(x.message.match(/https:\/\/\S+/)||[])[0];
        $('#cu_st').innerHTML=(x.state==='done'?'✅ ':'❌ ')+esc(x.message)+(link?`<div class="row" style="margin-top:6px"><a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">Öffnen</a><button class="btn sm" onclick="copyText('${esc(link)}')">📋 Link kopieren</button></div>`:'');
        break; }
    }catch(e){ $('#cu_st').textContent='❌ '+e.message; }
    $('#cu_go').disabled=false; };
}

  const usd=(c,un)=>c==null?(un?'?':'0 $'):(c<0.01&&c>0?'< 0,01 $':c.toLocaleString('de-AT',{maximumFractionDigits:2})+' $')+(un?' + ?':'');
  const tbl=(rows,head,cell)=>rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--mute);text-align:left">${head}<th>Aufrufe</th><th>Tokens</th><th>Kosten*</th></tr>`
    +rows.map(x=>`<tr style="border-top:1px solid var(--line)">${cell(x)}<td>${n(x.calls)}</td><td>${n(x.tokens)}</td><td>${usd(x.cost,x.unpriced)}</td></tr>`).join('')+'</table></div>':'<div style="color:var(--mute)">Keine Aufrufe in diesem Zeitraum.</div>';
  const t=r.total||{}; const abo=Object.entries(r.abo_5h||{});
  body.innerHTML=`
    <div class="row" style="margin-bottom:10px">${[1,7,30].map(d=>`<button class="btn sm ${d===days?'pri':''}" data-days="${d}">${d===1?'Heute (24 h)':d+' Tage'}</button>`).join('')}</div>
    <div class="task" style="padding:10px;margin-bottom:12px"><b>${n(t.calls)} KI-Aufrufe · ${n(t.tokens)} Tokens · ${usd(t.cost,t.unpriced)}</b>
      <div style="color:var(--mute);font-size:12px;margin-top:4px">Kein Limit, nur Übersicht. Abo (Claude-/Codex-CLI) und Ollama kosten hier 0 $, zählen aber gegen dein Abo bzw. den Pi.</div>
      ${abo.length?`<div style="margin-top:6px">${abo.map(([k,v])=>`${esc(r.labels[k]||k)}: <b>${v}</b> Aufrufe in den letzten 5 h${r.abo_warn?` (Telegram-Warnung ab ${r.abo_warn})`:''}`).join('<br>')}</div>`:''}</div>
    <b>Nach Projekt</b>${tbl(r.by_project,'<th>Projekt</th>',x=>`<td>${esc(x.name)}</td>`)}
    <br><b>Nach Agent</b>${tbl(r.by_agent,'<th>Agent</th>',x=>`<td>${esc(x.name)} <span style="color:var(--mute);font-size:11px">${esc(x.project)}</span></td>`)}
    <br><b>Nach KI-Modell</b>${tbl(r.by_model,'<th>Modell</th>',x=>`<td>${esc(r.labels[x.name]||x.name)}<br><span style="color:var(--mute);font-size:11px">${esc(x.model||'')}</span></td>`)}
    <div style="color:var(--mute);font-size:11px;margin-top:10px">* Geschätzt aus Tokens × grobem Mischpreis je Modell; „?“ = Preis unbekannt. Eigene Preise: <code>PCL_PRICES</code> in .env. Die Rechnung des Anbieters gilt.</div>`;
  body.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>showUsage(+b.dataset.days));
}
$('#btnUsage').onclick=()=>showUsage(7);

/* ---------- Firmenwissen (Ordner wissen/) ---------- */
async function showKnowledge(){
  if(!S.pid){ toast('Erst ein Projekt wählen.'); return; }
  openOv('🧠 Firmenwissen'); const body=$('#ovbody');
  const r=await api('/projects/'+S.pid+'/knowledge');
  const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
  body.innerHTML=`
    <div style="color:var(--mute);font-size:12px;margin-bottom:8px">Was <b>alle Agenten dieses Projekts</b> bei jedem Auftrag und im Chat wissen sollen: Firma, Kunden, Stil, Preise, Regeln, Ansprechpartner. Steht in <code>${esc(r.path)}</code>. Texte (.md/.txt) im Ordner <code>wissen/</code> gehen direkt mit (zusammen höchstens ${r.limit.toLocaleString('de-AT')} Zeichen), andere Dateien (PDF, Word …) sehen die Agenten als Liste und lesen sie bei Bedarf.</div>
    <textarea id="kn_text" style="min-height:260px" placeholder="z. B.\n- Wir sind eine Webagentur in Wien, Kunden sind kleine Handwerksbetriebe.\n- Sprache: Deutsch, Du-Form, keine Anglizismen.\n- Farben: Dunkelblau #1d3557, Akzent Orange.">${esc(r.text)}</textarea>
    <div class="row" style="margin:8px 0"><button class="btn pri" id="kn_save">Speichern</button><span id="kn_len" style="color:var(--mute);font-size:12px"></span></div>
    <div class="task" style="padding:10px;margin:10px 0">
      <b>Unterlagen ins Firmenwissen hochladen</b>
      <div style="color:var(--mute);font-size:12px;margin:3px 0 6px">Landen in <code>wissen/</code>, z. B. Preisliste, Styleguide, Kundenliste.</div>
      <input type="file" id="kn_up" multiple style="width:auto"><div id="kn_st" style="font-size:12px;color:var(--mute);margin-top:4px"></div>
    </div>
    ${r.files.map(f=>`<div class="task" style="padding:8px;display:flex;gap:10px;align-items:center"><span style="flex:1;word-break:break-all">${f.in_prompt?'📝':'📎'} ${esc(f.path)}</span><span style="color:var(--mute);font-size:12px;white-space:nowrap">${kb(f.size)}</span><button class="icon-btn" title="Datei löschen" data-kdel="${esc(f.path)}">🗑</button></div>`).join('')}`;
  const len=()=>{ $('#kn_len').textContent=$('#kn_text').value.length.toLocaleString('de-AT')+' Zeichen'; };
  $('#kn_text').oninput=len; len();
  $('#kn_save').onclick=async()=>{ await api('/projects/'+S.pid+'/knowledge','PUT',{text:$('#kn_text').value}); toast('Firmenwissen gespeichert'); };
  $('#kn_up').onchange=async e=>{
    for(const f of e.target.files){ $('#kn_st').textContent='Lade hoch: '+f.name+' …'; try{ await uploadFile(f,'wissen'); }catch(err){ toast(err.message); break; } }
    showKnowledge();
  };
  body.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=async()=>{ if(confirm('„'+b.dataset.kdel+'“ löschen?')){ await fetch('/api/projects/'+S.pid+'/files?path='+encodeURIComponent(b.dataset.kdel),{method:'DELETE',headers:{'X-PCL':'1'}}); showKnowledge(); } });
}
$('#btnKnow').onclick=showKnowledge;

/* ---------- Firma aus Vorlage ---------- */
function provOptions(def){ return S.providers.map(p=>`<option value="${p.id}" ${p.id===def?'selected':''}>${esc(p.label)}${p.configured?'':(p.id==='ollama'?' — nicht erreichbar':' — kein Key')}</option>`).join(''); }
async function wirePicker(id){
  const ps=$('#'+id+'_p'), ms=$('#'+id+'_m');
  async function load(){
    ms.innerHTML='<option value="">lade …</option>';
    let r; try{ r=await api('/providers/'+ps.value+'/models'); }catch(e){ r={models:[],default:''}; }
    ms.innerHTML=`<option value="">— Standard (${esc(r.default||'-')}) —</option>`+(r.models||[]).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  }
  ps.onchange=load; load();
}
$('#btnTplProj').onclick=async()=>{
  openOv('Firma aus Vorlage gründen'); const body=$('#ovbody');
  const tpls=await api('/templates');
  const defProv=(S.providers.find(p=>p.configured&&p.id!=='mock'&&!p.id.endsWith('cli'))||{id:'mock'}).id;
  body.innerHTML = `<div style="color:var(--mute);font-size:12px;margin-bottom:10px">Legt Projekt, Organigramm, Arbeitsanweisungen und Rechte komplett an. Danach kannst du alles ändern. Aufträge gibst du dem obersten Agenten (Post-Ansicht, Chat-Tab oder Telegram).</div>`
    + tpls.map(t=>`<div class="task" style="padding:10px"><b>${t.icon} ${esc(t.label)}</b> <span style="color:var(--mute);font-size:12px">· ${t.agents} Agenten</span>
        <div style="color:var(--mute);font-size:12px;margin:4px 0">${esc(t.desc)}</div>
        <div class="row"><button class="btn pri sm" data-tpl="${t.key}">Auswählen</button></div></div>`).join('');
  body.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{
    const t=tpls.find(x=>x.key===b.dataset.tpl);
    body.innerHTML = `<b>${t.icon} ${esc(t.label)}</b>
      <label>Name der Firma</label><input type="text" id="tp_name" value="${esc(t.label)}">
      <label>Ziel / Kontext (Land, Branche, Kunde …) – alle Agenten kennen es</label><textarea id="tp_goal" style="min-height:110px">${esc(t.goal)}</textarea>
      <label>KI-Modell für die Leitung (Chefs, die planen und prüfen)</label>
      <select id="tp_lead_p">${provOptions(defProv)}</select><select id="tp_lead_m" style="margin-top:6px"></select>
      <label>KI-Modell für die Mitarbeiter (Texte, Code, Recherche …)</label>
      <select id="tp_team_p">${provOptions(defProv)}</select><select id="tp_team_m" style="margin-top:6px"></select>
      <div class="row"><button class="btn sm" id="tp_loc_all">🖥️ Alles lokal (Ollama)</button><button class="btn sm" id="tp_loc_team">🖥️ Nur Mitarbeiter lokal (Ollama)</button></div>
      <div id="tp_loc_hint" style="color:var(--mute);font-size:12px;margin-top:4px"></div>
      <div style="color:var(--mute);font-size:12px;margin-top:6px">Tipp: Chefs brauchen das stärkste Modell (Planen, Prüfen, Denken), Mitarbeiter je nach Aufgabe ein gutes Text-, Code- oder schnelles Modell. Du kannst jeden Agenten später einzeln umstellen und testen.</div>
      <div class="row"><button class="btn pri" id="tp_go">Firma gründen</button><button class="btn" id="tp_back">Zurück</button></div>`;
    wirePicker('tp_lead'); wirePicker('tp_team');
    const setLocal=(ids)=>{
      const ol=S.providers.find(p=>p.id==='ollama');
      $('#tp_loc_hint').textContent = ol&&ol.configured ? 'Ollama ausgewählt – Modell in der Liste wählen. Kleine lokale Modelle sind auf dem Pi langsam; für Chefs besser ein starkes Modell.'
        : 'Ollama ist gerade nicht erreichbar (läuft „ollama serve“? Adresse OLLAMA_URL in .env). Du kannst es trotzdem schon zuweisen.';
      ids.forEach(id=>{ const e=$('#'+id+'_p'); e.value='ollama'; e.dispatchEvent(new Event('change')); });
    };
    $('#tp_loc_all').onclick=()=>setLocal(['tp_lead','tp_team']);
    $('#tp_loc_team').onclick=()=>setLocal(['tp_team']);
    $('#tp_back').onclick=()=>$('#btnTplProj').onclick();
    $('#tp_go').onclick=async()=>{
      $('#tp_go').disabled=true;
      const r=await api('/projects/from_template','POST',{template:t.key,name:$('#tp_name').value.trim()||t.label,goal:$('#tp_goal').value.trim()||undefined,
        models:{lead:{provider:$('#tp_lead_p').value,model:$('#tp_lead_m').value},team:{provider:$('#tp_team_p').value,model:$('#tp_team_m').value}}});
      $('#ov').classList.remove('on'); await loadProjects(); await openProject(r.id); toast('Firma gegründet.');
    };
  });
};
$('#btnAudit').onclick=async()=>{
  openOv('Verlauf (Audit-Log)');
  const rows=await api('/audit?limit=200'+(S.pid?'&project_id='+S.pid:''));
  $('#ovbody').innerHTML=rows.length?rows.map(r=>`<div class="logrow"><span class="ts">${fmt(r.ts)}</span> <b>${esc(r.event)}</b> ${r.agent_name?'· '+esc(r.agent_name):''}<br>${esc(r.detail)}</div>`).join(''):'<div style="color:var(--mute)">Leer.</div>';
};


/* ---------- Welten und Wachstum (Hyperstead) ---------- */
const WORLD = {list:null, g:null, at:0};
function wdef(){ return (WORLD.list && WORLD.g && WORLD.list.worlds[WORLD.g.world]) || null; }
function wword(k, dflt){ const w=wdef(); return (w && w.words[k]) || dflt; }
function applyWorldColors(){
  const w = wdef(), r = document.documentElement.style;
  if(!w){ r.removeProperty('--accent'); r.removeProperty('--accent2'); r.removeProperty('--ground'); return; }
  r.setProperty('--accent', w.colors.accent); r.setProperty('--accent2', w.colors.accent2);
  const light = document.documentElement.dataset.theme==='light' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: light)').matches);
  r.setProperty('--ground', light ? w.colors.ground : w.colors.ground_dark);
}
async function loadGrowth(force){
  if(!S.pid){ WORLD.g=null; renderGrowth(); return; }
  if(!force && Date.now()-WORLD.at < 10000) return;
  WORLD.at = Date.now();
  try{
    if(!WORLD.list) WORLD.list = await api('/worlds');
    const pid = S.pid, g = await api('/projects/'+pid+'/growth');
    if(pid!==S.pid) return;
    const before = WORLD.g && WORLD.g.pid===pid ? WORLD.g.stage : null;
    WORLD.g = {...g, pid};
    if(before!==null && g.stage>before && typeof celebrate==='function') celebrate(g);
  }catch(e){ return; }
  renderGrowth(); render();
}
function renderGrowth(){
  const el=$('#growth'), g=WORLD.g, w=wdef();
  el.classList.toggle('on', !!(g && w && S.graph));
  applyWorldColors();
  if(!g || !w) return;
  $('#gIco').textContent = g.icon;
  $('#gName').textContent = g.name+' · Stufe '+(g.stage+1)+'/'+g.stage_count;
  $('#gSub').textContent = g.next!==null ? `${g.points} ${w.words.points} · noch ${g.next-g.points} bis ${g.next_icon} ${g.next_name}` : `${g.points} ${w.words.points} · höchste Stufe erreicht`;
  $('#gBar').style.width = Math.round(g.progress*100)+'%';
  const ags=(S.graph&&S.graph.agents)||[]; let run=0, done=0;
  ags.forEach(a=>{ const c=a.counts||{}; run+=(c.running||0)+(c.queued||0)+(c.waiting_subtasks||0); done+=(c.done||0); });
  $('#gStats').innerHTML = `<span>👥 <b>${ags.length}</b>${g.limits&&g.team_limit?' / '+g.team_limit:''}</span><span>▶ <b>${run}</b> läuft</span><span>✓ <b>${done}</b> ${esc(w.words.done)}</span><span>✋ <b>${(S.graph&&S.graph.pending_approvals)||0}</b> Freigaben</span>`;
  const sel=$('#gWorld');
  if(sel.options.length!==Object.keys(WORLD.list.worlds).length)
    sel.innerHTML = Object.entries(WORLD.list.worlds).map(([k,v])=>`<option value="${k}">${esc(v.stages[0][0]+' '+v.name)}</option>`).join('');
  if(document.activeElement!==sel) sel.value = g.world;
}
$('#gWorld').onchange = async e=>{ if(!S.pid) return; await api('/projects/'+S.pid+'/world','PUT',{world:e.target.value}); await loadGrowth(true); loadProjects(); };
$('#gTheme').onclick = ()=>{
  const d=document.documentElement, cur=d.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  d.dataset.theme = cur==='light'?'dark':'light';
  try{ localStorage.setItem('hs-theme', d.dataset.theme); }catch(e){}
  applyWorldColors();
};
try{ const t=localStorage.getItem('hs-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
$('#gInfo').onclick = ()=>{
  const g=WORLD.g, w=wdef(), L=WORLD.list; if(!g||!w) return;
  openOv(`${w.stages[0][0]} Welt „${w.name}“ und Wachstum`);
  const P=L.points;
  $('#ovbody').innerHTML = `<div style="color:var(--mute);font-size:12px;margin-bottom:10px">${esc(w.tagline)} Die Welt ändert nur Aussehen und Begriffe. Die Agenten arbeiten weiter mit klaren Begriffen, ihre Qualität bleibt gleich.</div>
    <div class="tlabel">Stufen</div>
    ${w.stages.map((st,i)=>`<div class="logrow" style="${i===g.stage?'font-weight:700':''}">${st[0]} ${esc(st[1])} <span class="ts">ab ${L.stage_points[i]} ${esc(w.words.points)} · Führung wirbt selbst bis ${L.stage_team[i]??'beliebig viele'} Agenten an, ${L.stage_depth[i]??'volle'} Ebenen</span>${i===g.stage?' ← jetzt':''}</div>`).join('')}
    <div class="tlabel">Punkte</div>
    <div class="logrow">Lieferung beim ersten Mal ${esc(w.words.done)}: +${P.done_first} · nach Überarbeitung: +${P.done_revised} · Auftrag in der Post erledigt: +${P.inbox_closed} · fehlgeschlagen: ${P.task_failed} · Nacharbeit angefordert: ${P.inbox_rework}</div>
    <div class="tlabel">Ränge der Agenten</div>
    <div class="logrow">${w.ranks.map((r,i)=>`${r[0]} ${esc(r[1])} (ab ${L.rank_at[i]})`).join(' · ')}</div>
    <div class="chk" style="margin-top:12px"><input type="checkbox" id="gLim" ${g.limits?'checked':''}><div>Stufe begrenzt das Selbst-Anwerben der Führung<small>Du selbst kannst immer alles anlegen. Aus = die Führung darf so viele anwerben wie bisher.</small></div></div>`;
  $('#gLim').onchange = async e=>{ await api('/projects/'+S.pid+'/world','PUT',{limits:e.target.checked}); loadGrowth(true); };
};
function rankBadge(a){
  const r = WORLD.g && WORLD.g.ranks && WORLD.g.ranks[a.id]; if(!r) return '';
  return `<span class="n-rank" title="${esc(r.name)}: ${r.done} ${esc(wword('done','abgenommen'))}${r.next?' · nächster Rang ab '+r.next:''}">${r.icon}</span>`;
}

/* ---------- Start ---------- */
(async function init(){
  applyView();
  S.info = await api('/info');
  $('#btnLogout').style.display = S.info.auth ? '' : 'none';
  S.providers = await api('/providers');
  await loadProjects();
  if(S.projects.length) await openProject(S.projects[0].id);
  setInterval(()=>{ if(!document.hidden) refresh(); }, 2500);
})();
</script>
